name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # tomllib is stdlib from 3.11
      - name: Install the one dev dependency
        run: pip install pyyaml
      - name: Static gates
        run: python3 tools/check.py
      - name: The generated tree is current
        run: python3 tools/gen.py --check
      - name: Bootstrap tests (standard library only, like the script)
        run: python3 -m unittest discover -s tests -v

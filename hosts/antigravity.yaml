# Antigravity dialect. The only place Antigravity vocabulary appears.
host: antigravity
display: Google Antigravity
min_version: "1.1.27"          # agy CLI; registry re-verified unchanged at 1.2.6 and 1.2.10 (E17 addendum, E24); changed at 1.5.3 (E32)

agent_file:
  # Discovered by convention at the plugin root, with no manifest key [AG-07].
  path: "agents/{name}/agent.md"
  allowed_keys: [name, description, tools, mainAgent, subagent, model,
                 commandExecutionPolicy, mcpServers, skills, plugins, hidden,
                 inheritMcp, inheritCustomizations, rules, disabled,
                 enabledTools, disabledTools]
  # `agents:` exists in agy 1.1.27 and NOT in desktop 2.12.2 (E16), so the renderer does not
  # emit it: it would work on the CLI and be an unknown key on the desktop.
  never_emit: [agents]

# THE MEASURED REGISTRY (experiments.md E17, re-verified at 1.2.6 in its addendum), not AG-06's list.
# Seven names AG-06 gives are absent from the registry up to agy 1.2.10, six at 1.5.3 (E32),
# and abort the agent at startup with `unknown component: tool "<name>" not found in
# registry`. Re-derive this by running one agent per name at each supported version;
# grepping the binary yields a superset.
tool_registry:
  - view_file
  - run_command
  - write_to_file
  - replace_file_content
  - multi_replace_file_content
  - grep_search
  - find_by_name
  - list_dir
  - read_url_content
  - search_web
  - invoke_subagent
  - define_subagent
  - manage_task
  - manage_subagents
  - send_message
rejected_at_1_1_27: [view_file_outline, view_code_item, command_status, codebase_search,
                     browser_subagent, notify_user, manage_inbox]

# At 1.5.3 (E32) grep_search, find_by_name, list_dir, read_url_content and
# multi_replace_file_content still resolve and give no tool, and command_status resolves.
# The names below are right for 1.1.27 to 1.2.10.
capabilities:
  read:   [view_file]
  search: [grep_search, find_by_name, list_dir]
  shell:  [run_command]
  web:    [read_url_content, search_web]
  edit:   [write_to_file, replace_file_content, multi_replace_file_content]
  delegate: [invoke_subagent]

delegation:
  style: mechanical
  address_form: "{name}"
  tool: invoke_subagent
  # Measured (E19): an explicit `tools` list omitting invoke_subagent DOES override ambient
  # subagent inheritance — the specialist reports the tool unavailable.
  allowlist_overrides_inheritance: true

manifest:
  path: "plugin.json"            # ROOT, regular file, never a symlink (§6, E6)
  schema: "https://antigravity.google/schemas/v1/plugin.json"

install:
  # Measured: NO workspace root delivered agents at 1.1.27 and 1.2.10 (E18, E24). At 1.5.3
  # .agents/agents/, _agents/agents/, .agents/plugins/ and _agents/plugins/ all do (E32). The
  # package still installs globally only, so its roster is per-user.
  global_only: true
  command: "agy plugin install <dir>"
  url_form: "agy plugin install https://github.com/<owner>/e-colleagues"   # github.com only (E8)
  destination: "~/.gemini/config/plugins/{name}/"
  # A re-install merged at 1.1.27, so deleted files survived (E8); at 1.5.3 it replaces the
  # directory exactly (E32). On an older agy an update that drops a persona must uninstall
  # first, or delete the stale agent directory explicitly.

instructions:
  # Measured: AGENTS.md reached NO agy agent at 1.1.27 and 1.2.10 (E19, E24) and reaches every
  # one, sub-agents included, at 1.5.3 (E32). Bodies carry the contract for the older
  # versions, and the values below describe that 1.1.27 floor.
  file: null
  reaches_children: false
  body_carries_contract: true

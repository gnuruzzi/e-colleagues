# Antigravity dialect. The only place Antigravity vocabulary appears.
host: antigravity
display: Google Antigravity
min_version: "1.5.3"           # agy CLI; every claim re-run there (experiments.md E32). 1.1.27 to 1.2.10 are no longer supported

agent_file:
  # Discovered by convention at the plugin root, with no manifest key [AG-07].
  path: "agents/{name}/agent.md"
  allowed_keys: [name, description, tools, mainAgent, subagent, model,
                 commandExecutionPolicy, mcpServers, skills, plugins, hidden,
                 inheritMcp, inheritCustomizations, rules, disabled,
                 enabledTools, disabledTools]
  # `agents:` exists in agy 1.1.27 and NOT in desktop 2.12.2 (E16), so the renderer does not
  # emit it: it would work on the CLI and be an unknown key on the desktop.
  never_emit: [agents]

# THE MEASURED REGISTRY at agy 1.5.3 (experiments.md E32): the names that load AND give the
# agent a tool. Re-derive it by running one agent per name at each supported version;
# grepping the binary yields a superset.
tool_registry:
  - read_file
  - run_command
  - write_file
  - edit_file
  - search_web
  - invoke_subagent
  - define_subagent
  - manage_task
  - manage_subagents
  - send_message
# Up to 1.2.10 the first three file tools were named view_file, write_to_file and
# replace_file_content. Those names still load at 1.5.3 and arrive under the new ones.
# These load and give NO tool, with at most a line in --log-file, so the gate refuses them:
no_effect: [grep_search, find_by_name, list_dir, multi_replace_file_content, read_url_content,
            command_status]
# These abort the agent at startup: `unknown component: tool "<name>" not found in registry`.
rejected: [view_file_outline, view_code_item, codebase_search, browser_subagent, notify_user,
           manage_inbox]

# agy 1.5.3 has no search tool to list: a persona searches through its shell, and a persona
# without one could only read paths it is given. Every persona has a shell.
capabilities:
  read:   [read_file]
  search: []
  shell:  [run_command]
  web:    [search_web]
  edit:   [write_file, edit_file]
  delegate: [invoke_subagent]

delegation:
  style: mechanical
  address_form: "{name}"
  tool: invoke_subagent
  # Measured (E19): an explicit `tools` list omitting invoke_subagent DOES override ambient
  # subagent inheritance — the specialist reports the tool unavailable.
  allowlist_overrides_inheritance: true

manifest:
  path: "plugin.json"            # ROOT, regular file, never a symlink (§6, E6)
  schema: "https://antigravity.google/schemas/v1/plugin.json"

install:
  # At 1.5.3 a workspace delivers agents too, from .agents/agents/, _agents/agents/,
  # .agents/plugins/ and _agents/plugins/ (E32). The package installs globally only, by
  # choice, so its roster is per-user.
  global_only: true
  command: "agy plugin install <dir>"
  url_form: "agy plugin install https://github.com/<owner>/e-colleagues"   # github.com only (E8)
  destination: "~/.gemini/config/plugins/{name}/"
  # A re-install replaces the directory exactly (marker test, E32).

instructions:
  # AGENTS.md reaches the default agent, a custom agent and a sub-agent at 1.5.3 (E32). The
  # bodies still carry the contract: the desktop app did not receive AGENTS.md when last
  # driven, at 2.17.0 (E19 addendum), and has not been driven since.
  file: AGENTS.md
  reaches_children: true
  body_carries_contract: true

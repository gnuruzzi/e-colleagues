# opencode dialect. The only place opencode vocabulary appears.
host: opencode
display: opencode
min_version: "1.18.29"          # the floor; every runtime row re-verified at 2.0.18 (experiments.md E20 addendum)

# The published schema, vendored so the key lists below are checked against it offline:
# check.py fails when the agent keys, permission keys or command keys drift from it, so a
# key entering or leaving the schema fails a run instead of going unnoticed. Refresh with
#   curl -sS https://opencode.ai/config.json -o hosts/opencode-config.schema.json
# and re-run check.py. Fetched 2026-09-27, 39,039 bytes, sha256 e8cb6e28…, byte-identical
# to the copies read at 1.18.29 (E16 C3) and 2.0.8 (E17 addendum).
schema_file: opencode-config.schema.json

agent_file:
  path: "dist/opencode/agents/{name}.md"
  # [OC-02] KNOWN_KEYS. An unknown key is silently moved into `options`, so a misspelled
  # `permision:` yields full default permissions — check.py rejects anything outside this set
  # and any `options` content, because the runtime will not.
  allowed_keys: [name, description, model, variant, prompt, temperature, top_p, mode,
                 hidden, color, steps, maxSteps, options, permission, disable, tools]
  required_keys: [description, mode]

# The 15 permission keys from the published schema (E20 re-derived them at 1.18.29), plus
# the two names the 2.x runtime uses for `task` and `bash` (E20 addendum): the schema still
# lists only the old ones, the runtime accepts either, and unknown permission keys are
# schema-valid, so both can be present on every version.
permission_keys: [read, edit, glob, grep, list, bash, task, external_directory,
                  todowrite, question, webfetch, websearch, lsp, doom_loop, skill,
                  subagent, shell]

# Emitted beside the old name with identical rules, and check.py requires the pair. One
# spelling alone is a silent fail-open on the version that knows only the other: the rule
# vanishes and the default permission applies, which is the failure the gate exists to catch.
permission_aliases: { task: subagent, bash: shell }

capabilities:
  edit_true:  { edit: allow }
  edit_false:
    edit: deny
    # Pattern rules rather than a blanket `ask`. A blanket ask would be DENIED outright in
    # `opencode run` — every headless session stamps `question: * deny` on parent and
    # subtask alike (E20); at 2.0.18 the question is auto-dismissed and the run exits 1
    # (E20 addendum) — either way it removes the shell when the reviewer needs it.
    bash:
      "*": allow
      "git commit*": deny
      "git stash*": deny
      "sed -i*": deny
  no_web: { webfetch: deny, websearch: deny }

delegation:
  style: mechanical
  address_form: "{name}"
  tool: task
  parameter: subagent_type
  # Children get `task * deny` automatically [OC-05]; the primary gets an explicit allowlist.
  child_denies_task: true

config:
  path: "dist/opencode/opencode.json"
  schema: "https://opencode.ai/config.json"
  default_agent_key: default_agent
  # A typo in default_agent is a hard config error for every user of the repo [OC-03].
  # Command entries: {template, description, agent, model, variant, subtask}, template
  # REQUIRED, additionalProperties false (E20 corrected §13's list).
  command_keys: [template, description, agent, model, variant, subtask]
  command_required: [template]

instructions:
  file: "AGENTS.md"
  # Measured (E20): a task child DOES receive AGENTS.md.
  reaches_children: true
  body_carries_contract: false
